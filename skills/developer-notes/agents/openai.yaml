interface:
  display_name: "开发笔记"
  short_description: "分类、查重并安全整理 Obsidian 学习与开发笔记"
  default_prompt: "Use $developer-notes to search or classify this learning or development knowledge, and create or update an Obsidian note only when I request a write."

dependencies:
  tools:
    - type: "mcp"
      value: "obsidian"
      description: "Obsidian Local REST API with MCP"
      transport: "streamable_http"
      url: "http://127.0.0.1:27123/mcp/"

policy:
  allow_implicit_invocation: true
